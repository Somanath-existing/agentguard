[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.3.0"
description = "Lightweight runtime guardrails for autonomous LLM agents — trajectory tracking, statistical baselines, and adaptive recovery"
authors = [
    { name = "Somanath", email = "somanath@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
    "llm", "agents", "security", "observability", "opentelemetry",
    "langchain", "prompt-injection", "guardrails", "ai-safety",
    "taint-tracking", "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
redis = ["redis>=5"]
langchain = ["opentelemetry-instrumentation-langchain>=0.24"]
openai = ["opentelemetry-instrumentation-openai>=0.24"]
anthropic = ["opentelemetry-instrumentation-anthropic>=0.24"]
semantic = ["sentence-transformers>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "redis>=5",
    "opentelemetry-instrumentation-langchain>=0.24",
    "opentelemetry-instrumentation-openai>=0.24",
    "opentelemetry-instrumentation-anthropic>=0.24",
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/Somanath-existing/agentguard"
Documentation = "https://github.com/Somanath-existing/agentguard#readme"
Repository = "https://github.com/Somanath-existing/agentguard"
Issues = "https://github.com/Somanath-existing/agentguard/issues"
Changelog = "https://github.com/Somanath-existing/agentguard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = [
    "E501",  # line length handled by formatting
    "S101",  # allow assert in tests
    "S311",  # standard random is fine for UCB1 bandit exploration
    "S110",  # try-except-pass for optional payload decoding
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
